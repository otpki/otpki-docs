openapi: 3.1.0
info:
  title: otpki.public.enrollment.plugin.protocol.scep.v1
paths:
  /v1/scep/{name}/cgi-bin/pkiclient.exe:
    post:
      tags:
        - otpki.public.enrollment.plugin.protocol.scep.v1.SCEPService
      summary: SCEPEndpoint
      description: |-
        buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
         buf:lint:ignore RPC_REQUEST_STANDARD_NAME
         buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
      operationId: otpki.public.enrollment.plugin.protocol.scep.v1.SCEPService.SCEPEndpoint
      parameters:
        - name: name
          in: path
          description: CA name
          required: true
          schema:
            type: string
            title: name
            description: CA name
        - name: operation
          in: query
          schema:
            type: string
            title: operation
        - name: message
          in: query
          schema:
            type: string
            title: message
      requestBody:
        content:
          application/json:
            schema:
              type: string
              title: data
              format: byte
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.api.HttpBody'
components:
  schemas:
    google.api.HttpBody:
      type: object
      properties:
        contentType:
          type: string
          title: content_type
          description: The HTTP Content-Type header value specifying the content type of the body.
        data:
          type: string
          title: data
          format: byte
          description: The HTTP request/response body as raw binary.
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          title: extensions
          description: |-
            Application specific response metadata. Must be set in the first response
             for streaming APIs.
      title: HttpBody
      additionalProperties: false
      description: |-
        Message that represents an arbitrary HTTP body. It should only be used for
         payload formats that can't be represented as JSON, such as raw binary or
         an HTML page.


         This message can be used both in streaming and non-streaming API methods in
         the request as well as the response.

         It can be used as a top-level request field, which is convenient if one
         wants to extract parameters from either the URL or HTTP template into the
         request fields and also want access to the raw HTTP body.

         Example:

             message GetResourceRequest {
               // A unique request id.
               string request_id = 1;

               // The raw HTTP body is bound to this field.
               google.api.HttpBody http_body = 2;

             }

             service ResourceService {
               rpc GetResource(GetResourceRequest)
                 returns (google.api.HttpBody);
               rpc UpdateResource(google.api.HttpBody)
                 returns (google.protobuf.Empty);

             }

         Example with streaming methods:

             service CaldavService {
               rpc GetCalendar(stream google.api.HttpBody)
                 returns (stream google.api.HttpBody);
               rpc UpdateCalendar(stream google.api.HttpBody)
                 returns (stream google.api.HttpBody);

             }

         Use of this type only changes how the request and response bodies are
         handled, all other features will continue to work unchanged.
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    otpki.public.enrollment.plugin.protocol.scep.v1.SCEPMessage:
      type: object
      properties:
        data:
          type: string
          title: data
          format: byte
        operation:
          type: string
          title: operation
        name:
          type: string
          title: name
          description: CA name
        message:
          type:
            - string
            - "null"
          title: message
      title: SCEPMessage
      additionalProperties: false
security: []
tags:
  - name: otpki.public.enrollment.plugin.protocol.scep.v1.SCEPService
