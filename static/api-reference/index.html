<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTPKI API Reference</title>
    <script src="../scalar.js"></script>
    <style>
      :root {
        color-scheme: light;
        --app-border: #d6dde8;
        --app-muted: #6b7280;
        --app-panel: #f8fafc;
        --app-bg: #ffffff;
        --app-primary: #0073cf;
      }

      html,
      body {
        background: var(--app-bg);
        height: 100%;
        margin: 0;
      }

      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }

      .toolbar {
        align-items: center;
        background: var(--app-panel);
        border-bottom: 1px solid var(--app-border);
        display: flex;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .toolbar-label {
        color: var(--app-muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin-right: 0.25rem;
        text-transform: uppercase;
      }

      .toolbar-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .toolbar-button {
        background: #fff;
        border: 1px solid var(--app-border);
        border-radius: 999px;
        color: #1f2937;
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.45rem 0.9rem;
      }

      .toolbar-button.active {
        background: color-mix(in srgb, var(--app-primary) 12%, white);
        border-color: color-mix(in srgb, var(--app-primary) 28%, var(--app-border));
        color: var(--app-primary);
      }

      .reference {
        min-height: 0;
      }

      #api-reference {
        height: 100%;
      }

      a[href="https://www.scalar.com"] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <span class="toolbar-label">Service</span>
        <div class="toolbar-buttons" id="service-buttons"></div>
      </div>
      <div class="reference">
        <div id="api-reference"></div>
      </div>
    </div>
    <script>
      const query = new URLSearchParams(window.location.search);
      const specRoot = (query.get('specRoot') || '/openapi/current').replace(/\/$/, '');
      const services = [
        {
          id: 'issuance',
          label: 'Issuance',
          path: '/issuance/v1/issuance_service.openapi.yaml',
        },
        {
          id: 'validation',
          label: 'Validation',
          path: '/validation/v1/validation_service.openapi.yaml',
        },
        {
          id: 'enrollment',
          label: 'Enrollment',
          path: '/enrollment/v1/enrollment_service.openapi.yaml',
        },
      ];

      const container = document.getElementById('api-reference');
      const buttonRoot = document.getElementById('service-buttons');
      let activeService = query.get('service') || services[0].id;

      function renderButtons() {
        buttonRoot.innerHTML = '';
        for (const service of services) {
          const button = document.createElement('button');
          button.className = 'toolbar-button';
          if (service.id === activeService) {
            button.classList.add('active');
          }
          button.textContent = service.label;
          button.type = 'button';
          button.addEventListener('click', () => {
            if (activeService === service.id) {
              return;
            }
            activeService = service.id;
            const nextQuery = new URLSearchParams(window.location.search);
            nextQuery.set('service', service.id);
            history.replaceState({}, '', `${window.location.pathname}?${nextQuery.toString()}`);
            renderButtons();
            renderReference();
          });
          buttonRoot.appendChild(button);
        }
      }

      function renderReference() {
        const service = services.find((entry) => entry.id === activeService) || services[0];
        container.innerHTML = '';
        window.Scalar.createApiReference('#api-reference', {
          url: `${specRoot}${service.path}`,
          hideClientButton: true,
          hideDarkModeToggle: true,
          searchHotKey: 'k',
        });
      }

      renderButtons();
      renderReference();
    </script>
  </body>
</html>
